spring.application.name=THiRDEYE30-GATEWAY
spring.profiles.active=${PROFILE}
thirdeye.priority=1
thirdeye.api.key=${THIRDEYE_API_KEY}
thirdeye.jwt.secret=${THIRDEYE_JWT_SECRET_KEY}
thirdeye.jwt.token.starter=${THIRDEYE_TOKEN_STARTER}
telegrambot.api.key=${TELEGRAMBOT_API_KEY}
webscrapper.api.key=${WEBSCRAPPER_API_KEY}
thirdeye.open-api=${OPEN_URLS}
thirdeye.user-api=${USER_URLS}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.main.web-application-type=reactive

spring.cloud.gateway.routes[0].id=THIRDEYE30-MESSAGEBROKER-TELEGRAMBOT
spring.cloud.gateway.routes[0].uri=lb://THIRDEYE30-MESSAGEBROKER
spring.cloud.gateway.routes[0].predicates[0]=Path=/mb/message/telegrambot/**
spring.cloud.gateway.routes[0].filters[0]=TelegrambotApiKeyFilter
spring.cloud.gateway.routes[0].filters[1].name=Retry
spring.cloud.gateway.routes[0].filters[1].args.retries=3
spring.cloud.gateway.routes[0].filters[1].args.series=SERVER_ERROR
spring.cloud.gateway.routes[0].filters[1].args.statuses=BAD_GATEWAY,GATEWAY_TIMEOUT
spring.cloud.gateway.routes[0].filters[1].args.methods=GET
spring.cloud.gateway.routes[0].filters[1].args.exceptions=java.io.IOException,java.util.concurrent.TimeoutException
spring.cloud.gateway.routes[0].filters[1].args.backoff.firstBackoff=50ms
spring.cloud.gateway.routes[0].filters[1].args.backoff.maxBackoff=500ms
spring.cloud.gateway.routes[0].filters[1].args.backoff.factor=2
spring.cloud.gateway.routes[0].filters[1].args.backoff.basedOnPreviousValue=false

